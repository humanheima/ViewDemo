plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.google.protobuf' version '0.9.4'
    id 'application'
}

// Kotlin JVM 编译目标
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
compileKotlin {
    kotlinOptions {
        jvmTarget = '17'
    }
}

// 共享 app 模块里的 proto 文件，避免重复
sourceSets {
    main {
        proto {
            srcDir '../app/src/main/proto'
        }
        kotlin {
            srcDir 'src/main/kotlin'
        }
    }
}

// protobuf 生成配置：服务端需要 full（非 lite）才能拿到 SpeechServiceImplBase
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.24.4"
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.59.0'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins { java { } }    // full Java (非 lite)
            task.plugins { grpc { } }     // full gRPC (含 server-side base class)
        }
    }
}

application {
    mainClass = 'com.hm.viewdemo.mockserver.MockSpeechServer'
}

dependencies {
    // gRPC server-side
    implementation 'io.grpc:grpc-netty-shaded:1.59.0'
    implementation 'io.grpc:grpc-protobuf:1.59.0'
    implementation 'io.grpc:grpc-stub:1.59.0'
    // javax.annotation.Generated 在 JDK 17 上可能缺失，显式引入
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}
