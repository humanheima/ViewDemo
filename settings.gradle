pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
        maven { url = "https://jitpack.io" }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.google.protobuf') {
                useModule("com.google.protobuf:protobuf-gradle-plugin:${requested.version}")
            }
        }
    }
}

include ':myruleview'
include ':ruler'
include ':colorfulprogressbar'
include ':app', ':pullrefresh', ':countdowntimer', ':dot-progress-bar'
include ':soft_keyboard'
include ':expandabletextviewlibrary'
include ':mockserver'
